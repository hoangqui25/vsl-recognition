<!doctype html>

<html>
  <head>
    <title>Batch Recognition</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-5">
      <h1>VSL400 Batch Recognition</h1>

      <table class="table table-bordered">
        <tr>
          <th>Video</th>

          <th>Prediction</th>

          <th>Confidence</th>
        </tr>

        {% for item in results %}

        <tr>
          <td>{{item.video}}</td>

          <td>{{item.gloss}}</td>

          <td>{{"%.2f"|format(item.confidence)}} %</td>
        </tr>

        {% endfor %}
      </table>
    </div>
  </body>
</html>
